name: University Management CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: chmod +x mvnw && ./mvnw --batch-mode clean verify

      - name: Build Docker Image
        run: docker build -t university-management:latest .