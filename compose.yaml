services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: university
      POSTGRES_PASSWORD: university123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/university_db
      DB_USERNAME: university
      DB_PASSWORD: university123
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
