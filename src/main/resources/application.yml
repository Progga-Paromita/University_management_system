
spring:
  application:
    name: university-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/university_db}
    username: ${DB_USERNAME:university}
    password: ${DB_PASSWORD:university123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  thymeleaf:
    cache: false

server:
  port: 8080
