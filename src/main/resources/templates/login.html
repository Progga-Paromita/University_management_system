<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Management - Login</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--card);
            border-radius: 1rem;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .brand-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .login-header p {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-top: 0.35rem;
        }

        .login-body {
            padding: 2rem;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .alert-error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-info {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .demo-accounts {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.825rem;
            color: var(--text-muted);
        }

        .demo-accounts h4 {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .demo-accounts table {
            width: 100%;
            border-collapse: collapse;
        }

        .demo-accounts td {
            padding: 0.2rem 0;
        }

        .demo-accounts code {
            background: #f1f5f9;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-size: 0.8rem;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="brand-icon">🎓</div>
        <h2>University Management</h2>
        <p>Sign in to access the system</p>
    </div>

    <div class="login-body">
        <div th:if="${param.error}" class="alert alert-error">
            Invalid username or password. Please try again.
        </div>

        <div th:if="${param.logout}" class="alert alert-info">
            You have successfully logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="e.g. admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="demo-accounts">
            <h4>Default Demo Credentials:</h4>
            <table>
                <tr>
                    <td><strong>Admin:</strong></td>
                    <td><code>admin</code> / <code>Admin123!</code></td>
                </tr>
                <tr>
                    <td><strong>Teacher:</strong></td>
                    <td><code>teacher</code> / <code>Teacher123!</code></td>
                </tr>
                <tr>
                    <td><strong>Student:</strong></td>
                    <td><code>student</code> / <code>Student123!</code></td>
                </tr>
            </table>
        </div>
    </div>
</div>

</body>
</html>
