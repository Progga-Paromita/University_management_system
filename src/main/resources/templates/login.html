<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Management - Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="brand-icon">🎓</div>
        <h2>University Management</h2>
        <p>Sign in to access the system</p>
    </div>

    <div class="login-body">
        <div th:if="${param.error}" class="alert alert-error">
            Invalid username or password. Please try again.
        </div>

        <div th:if="${param.logout}" class="alert alert-info">
            You have successfully logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="e.g. admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

    </div>
</div>

</body>
</html>
