<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - University Management</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        .error-status {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ef4444;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-message {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="login-card" style="text-align: center;">
    <div class="login-header" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">
        <div class="brand-icon">⚠️</div>
        <h2>Access Notice</h2>
    </div>

    <div class="login-body">
        <div class="error-status" th:text="${status} ?: '403'">403</div>
        <p class="error-message" th:text="${message} ?: 'You do not have permission to access this resource or page.'">
            You do not have permission to access this resource or page.
        </p>

        <a th:href="@{/}" class="btn-submit" style="display: inline-block; text-decoration: none;">
            &larr; Return to Dashboard
        </a>
    </div>
</div>

</body>
</html>
