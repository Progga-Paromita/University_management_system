<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Teachers Management - University System</title>
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body class="role-teacher">

<header>
    <div class="header-left">
        <a th:href="@{/}" class="btn-back">&larr; Dashboard</a>
        <div class="brand-title">🎓 University Management</div>
    </div>
    <div class="user-nav">
        <div class="user-badge">
            <strong sec:authentication="name">User</strong>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</header>

<main>
    <div class="page-header">
        <div class="page-title-group">
            <h1>
                Teachers Management
                <span class="badge-role">TEACHER</span>
            </h1>
        </div>
        <button class="btn-primary" onclick="openCreateModal()">
            <span>➕</span> Add New Teacher
        </button>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert">
        <span id="alertMsg"></span>
        <button class="close-btn" onclick="hideAlert()">&times;</button>
    </div>

    <!-- Data Table Container -->
    <div class="table-container">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by username, name, email..." oninput="filterTable()">
            </div>
            <div class="count-badge">
                Total: <span id="userCount">0</span> teachers
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th style="width: 160px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Dynamically populated rows -->
            </tbody>
        </table>

        <div id="emptyState" class="empty-state" style="display: none;">
            <p>No teachers found.</p>
        </div>
    </div>
</main>

<!-- Create / Edit Modal -->
<div id="userModal" class="modal-overlay">
    <div class="modal-dialog">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Add New Teacher</h3>
            <button class="modal-close" onclick="closeUserModal()">&times;</button>
        </div>
        <form id="userForm" onsubmit="handleFormSubmit(event)">
            <div class="modal-body">
                <div id="modalError" class="modal-error"></div>
                <input type="hidden" id="userId">

                <div class="form-group">
                    <label for="username">Username <span style="color:red">*</span></label>
                    <input type="text" id="username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name <span style="color:red">*</span></label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email <span style="color:red">*</span></label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password <span id="pwdAsterisk" style="color:red">*</span></label>
                    <input type="password" id="password" autocomplete="new-password">
                    <div id="pwdHint" class="hint">Required for new teachers.</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeUserModal()">Cancel</button>
                <button type="submit" id="btnSave" class="btn-primary">Save Teacher</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal-overlay">
    <div class="modal-dialog">
        <div class="modal-header">
            <h3 class="modal-title">Confirm Deletion</h3>
            <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to permanently delete teacher <strong id="deleteTargetName"></strong>?</p>
            <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.5rem;">This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            <button type="button" class="btn-danger-confirm" id="btnConfirmDelete" onclick="executeDelete()">Delete Permanently</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/teachers';
    let allUsers = [];
    let deleteUserId = null;

    function getCsrfHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
        if (token && header) {
            headers[header] = token;
        }
        return headers;
    }

    function showAlert(msg, isSuccess = true) {
        const box = document.getElementById('alertBox');
        const text = document.getElementById('alertMsg');
        box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        text.textContent = msg;
        box.style.display = 'flex';
        setTimeout(() => {
            box.style.display = 'none';
        }, 5000);
    }

    function hideAlert() {
        document.getElementById('alertBox').style.display = 'none';
    }

    async function loadUsers() {
        try {
            const res = await fetch(API_BASE);
            if (!res.ok) throw new Error('Failed to fetch data (' + res.status + ')');
            allUsers = await res.json();
            renderTable(allUsers);
        } catch (err) {
            showAlert(err.message, false);
        }
    }

    function renderTable(users) {
        const tbody = document.getElementById('userTableBody');
        const emptyState = document.getElementById('emptyState');
        const countSpan = document.getElementById('userCount');

        tbody.innerHTML = '';
        countSpan.textContent = users.length;

        if (users.length === 0) {
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';

        users.forEach(u => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>#${u.id}</strong></td>
                <td>${escapeHtml(u.username)}</td>
                <td>${escapeHtml(u.fullName)}</td>
                <td>${escapeHtml(u.email)}</td>
                <td><span class="role-pill">${escapeHtml(u.role)}</span></td>
                <td style="text-align: center;">
                    <div class="action-group" style="justify-content: center;">
                        <button class="btn-action btn-edit" onclick="openEditModal(${u.id})">✏️ Edit</button>
                        <button class="btn-action btn-delete" onclick="openDeleteModal(${u.id})">🗑️ Delete</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!query) {
            renderTable(allUsers);
            return;
        }
        const filtered = allUsers.filter(u =>
            (u.username && u.username.toLowerCase().includes(query)) ||
            (u.fullName && u.fullName.toLowerCase().includes(query)) ||
            (u.email && u.email.toLowerCase().includes(query))
        );
        renderTable(filtered);
    }

    function openCreateModal() {
        document.getElementById('userId').value = '';
        document.getElementById('username').value = '';
        document.getElementById('fullName').value = '';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        document.getElementById('password').required = true;
        document.getElementById('pwdAsterisk').style.display = 'inline';
        document.getElementById('pwdHint').textContent = 'Required for new teachers.';
        document.getElementById('modalTitle').textContent = 'Add New Teacher';
        document.getElementById('btnSave').textContent = 'Save Teacher';
        document.getElementById('modalError').style.display = 'none';
        document.getElementById('userModal').style.display = 'flex';
    }

    async function openEditModal(id) {
        const user = allUsers.find(u => u.id === id);
        if (!user) return;

        document.getElementById('userId').value = user.id;
        document.getElementById('username').value = user.username;
        document.getElementById('fullName').value = user.fullName;
        document.getElementById('email').value = user.email;
        document.getElementById('password').value = '';
        document.getElementById('password').required = false;
        document.getElementById('pwdAsterisk').style.display = 'none';
        document.getElementById('pwdHint').textContent = 'Leave blank to keep existing password unchanged.';
        document.getElementById('modalTitle').textContent = `Edit Teacher (#${user.id})`;
        document.getElementById('btnSave').textContent = 'Save Changes';
        document.getElementById('modalError').style.display = 'none';
        document.getElementById('userModal').style.display = 'flex';
    }

    function closeUserModal() {
        document.getElementById('userModal').style.display = 'none';
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('userId').value;
        const username = document.getElementById('username').value.trim();
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('modalError');

        const payload = { username, fullName, email };
        if (password) {
            payload.password = password;
        }

        const isUpdate = Boolean(id);
        const url = isUpdate ? `${API_BASE}/${id}` : API_BASE;
        const method = isUpdate ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: getCsrfHeaders(),
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                let errText = 'Operation failed';
                try {
                    const errObj = await res.json();
                    errText = errObj.message || errObj.detail || errObj.error || errText;
                } catch(e) {}
                errorDiv.textContent = errText;
                errorDiv.style.display = 'block';
                return;
            }

            closeUserModal();
            showAlert(`Teacher successfully ${isUpdate ? 'updated' : 'created'}!`, true);
            await loadUsers();
        } catch (err) {
            errorDiv.textContent = err.message;
            errorDiv.style.display = 'block';
        }
    }

    function openDeleteModal(id) {
        const user = allUsers.find(u => u.id === id);
        if (!user) return;
        deleteUserId = id;
        document.getElementById('deleteTargetName').textContent = `'${user.username}' (#${id})`;
        document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() {
        deleteUserId = null;
        document.getElementById('deleteModal').style.display = 'none';
    }

    async function executeDelete() {
        if (!deleteUserId) return;
        try {
            const res = await fetch(`${API_BASE}/${deleteUserId}`, {
                method: 'DELETE',
                headers: getCsrfHeaders()
            });

            if (!res.ok) {
                let errText = 'Failed to delete teacher';
                try {
                    const errObj = await res.json();
                    errText = errObj.message || errObj.detail || errText;
                } catch(e) {}
                showAlert(errText, false);
            } else {
                showAlert('Teacher deleted successfully.', true);
            }
            closeDeleteModal();
            await loadUsers();
        } catch (err) {
            showAlert(err.message, false);
            closeDeleteModal();
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
</script>

</body>
</html>
